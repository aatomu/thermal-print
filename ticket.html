<!DOCTYPE html>

<html>

<head>
  <meta charset="utf-8">
  <title>Thermal Print by ESC/POS</title>

  <style>
    body {
      width: 100vw;
      margin: 0;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
    }

    .controls {
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      justify-content: flex-start;
      align-items: center;

      width: 50vw;
      gap: 10px;
    }

    .ui-input {
      height: 40lh;
      width: 100%;
      resize: none;

      box-sizing: border-box;
      overflow: scroll;
      text-wrap: no-wrap;
      white-space: pre;
    }

    .preview {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-start;
    }

    .preview * {
      margin: 20px;
    }

    .preview-area {
      border-color: black;
      border-style: solid;
      border-width: 3px;
    }

    .preview-area *:hover {
      animation: clock 0.5s linear infinite;
    }

    @keyframes clock {
      0%,100% {
        stroke: transparent;
        stroke-width: 0px;
        transition: all 0.5s linear;
      }

      50% {
        stroke: rgba(0, 0, 0, 1);
        stroke-width: 1px;
      }
    }

    .preview-print {
      border-color: lightgrey;
      border-width: 3px;
      border-style: solid;
    }
  </style>
</head>

<body>
  <div style="display: flex;  flex-direction: row;  flex-wrap: nowrap;  align-items: flex-start;">
    <!-- Left -->
    <div class="controls">
      <ol type="I">
        <li>
          Connect to Thermal Printer<br>
          <button id="connect">Call to Connect</button>
        </li>
        <li>
          Input your SVG code.
        </li>
        <li>
          Drag & Drop to move
        </li>
        <li>
          Print your SVG to thermal printer.<br>
          <button id="thermal-print">Call to Print</button>
        </li>
      </ol>
      <div style="display: grid;  grid-template-columns: 10em 1fr;  align-items: center;  justify-items: stretch; gap: 5px;">
        <span>Paper Width:</span> <span><input type="range" id="paper-width" min="32" max="512" step="16" value="384"><span id="paper-width-value"></span></span>
        <span>Print Quality:</span> <select id="print-quality">
          <option value="0">8dot single-density</option>
          <option value="1">8dot double-density</option>
          <option value="32">24dot single-density</option>
          <option value="33" selected>24dot double-density</option>
        </select>
        <span>Input Image</span>
        <div style="position: relative; background-color: lightgray;  border-radius: 5px; width:15em;  height: 1lh;">
          <div style="position:absolute;  top: 0;  left: 0;  height: 100%; width: 100%;">Drag&Drop or Click here.</div>
          <input type="file" id="input-file" accept="image/*" style="position:absolute;  top: 0;  left: 0;  height: 100%; width: 100%; opacity: 0;">
        </div>
      </div>
      <textarea class="ui-input" placeholder="Main SVG" id="input-svg"><text x="50" y="10" style="transform: translate(27px, 25px);">Hello world!</text></textarea>
    </div>

    <!-- Right -->
    <div class="preview">
      <svg xmlns="http://www.w3.org/2000/svg" class="preview-area" id="preview-raw" style="filter: grayscale(100%);user-select: none;"> </svg>
      <canvas class="preview-print" id="preview-print"></canvas>
    </div>
  </div>
  </div>
</body>

<script src="./escpos.js"></script>

<!-- HTML preview control -->
<script>
  // @ts-check
  /** @type {HTMLInputElement} */
  // @ts-expect-error
  const paperWidth = document.getElementById("paper-width")
  /** @type {HTMLSpanElement} */
  // @ts-expect-error
  const paperWidthValue = document.getElementById("paper-width-value")
  /** @type {HTMLSelectElement} */
  // @ts-expect-error
  const printQuality = document.getElementById("print-quality")
  /** @type {HTMLInputElement} */
  // @ts-expect-error
  const inputFile = document.getElementById("input-file")
  /** @type {HTMLTextAreaElement} */
  // @ts-expect-error
  const inputSVG = document.getElementById("input-svg")

  /** @type {SVGElement} */
  // @ts-expect-error
  const previewRaw = document.getElementById("preview-raw")
  /** @type {HTMLCanvasElement} */
  // @ts-expect-error
  const previewPrint = document.getElementById("preview-print")

  /** @type {HTMLButtonElement} */
  // @ts-expect-error
  const connect = document.getElementById("connect")
  /** @type {HTMLButtonElement} */
  // @ts-expect-error
  const convert = document.getElementById("convert")
  /** @type {HTMLButtonElement} */
  // @ts-expect-error
  const dithering = document.getElementById("dithering")
  /** @type {HTMLButtonElement} */
  // @ts-expect-error
  const thermalPrint = document.getElementById("thermal-print")

  /** @type {ThermalPrinter|null} */
  let printer = null

  let clickStart = { x: 0, y: 0 }
  let offset = { x: 0, y: 0 }

  let inputDebounceId = 0

  connect.addEventListener("click", async () => {
    printer = new ThermalPrinter()
    await printer.connect()
  })

  thermalPrint.addEventListener("click", () => {
    if (!printer) {
      alert("Printer not connected!!")
      return
    }
    const width = previewPrint.width
    const height = Math.floor(previewPrint.height * (25 / 38))

    const scaleCanvas = document.createElement("canvas")
    scaleCanvas.width = width
    scaleCanvas.height = height
    /** @type {CanvasRenderingContext2D}*/
    // @ts-expect-error
    const scaleCtx = scaleCanvas.getContext("2d")
    scaleCtx.imageSmoothingEnabled = false
    scaleCtx.drawImage(previewPrint, 0, 0, width, height)

    const quality = parseInt(printQuality.value, 10)
    let byte = 1
    if (quality == 32 || quality == 33) {
      byte = 3
    }
    const yStep = 8 * byte

    const image = scaleCtx.getImageData(0, 0, width, height)
    for (let y = 0; y < height; y += yStep) {
      const binary = []
      for (let x = 0; x < width; x++) {
        for (let b = 0; b < byte; b++) {
          let column = 0
          for (let offset = 0; offset < 8; offset++) {
            column = column << 1
            if (y + b * 8 + offset > height) continue

            const index = ((y + b * 8 + offset) * width + x) * 4
            if (image.data[index] == 0) {
              column |= 1
            }
          }
          binary.push(column)
        }
      }
      console.log(binary)

      printer.BitImage_Print(quality, width, binary)
      printer.send()
    }
  })

  // Config
  paperWidth.addEventListener("change", () => {
    const width = Number(paperWidth.value) / 2

    previewRaw.style.width = `${width}px`
    previewRaw.setAttribute("width", width.toString())

    previewPrint.style.width = `${width}px`

    paperWidthValue.innerText = (width * 2).toString().padStart(3, "0")
  })
  paperWidth.dispatchEvent(new Event("change"))


  // Preview
  inputFile.addEventListener("change", (event) => {
    const files = inputFile.files
    if (!files) return
    const file = files[0]

    const reader = new FileReader()
    reader.addEventListener("load", () => {
      const image = document.createElementNS("http://www.w3.org/2000/svg", "image")
      /** @type {string|null} */
      // @ts-expect-error
      const base64 = reader.result
      if (!base64) return
      image.setAttributeNS(null, "href", base64)
      image.setAttributeNS(null, "x", "0")
      image.setAttributeNS(null, "y", "50")
      image.setAttributeNS(null, "height", "50")

      inputSVG.value += image.outerHTML
      inputSVG.dispatchEvent(new Event("input"))
    })
    reader.readAsDataURL(file)
  })


  inputSVG.addEventListener("input", () => {
    clearTimeout(inputDebounceId)

    inputDebounceId = setTimeout(() => {
      updatePreview()
      svg2canvas()
      ditheringCanvas()
    }, 200)
  })
  inputSVG.dispatchEvent(new Event("input"))

  function updatePreview() {
    previewRaw.innerHTML = inputSVG.value
    updateHeight()

    for (const child of previewRaw.children) {
      /** @type {HTMLElement}*/
      // @ts-expect-error
      const element = child
      console.log(element)
      element.addEventListener("mousedown", (event) => {
        console.log(element, "down")
        element.setAttribute("target", "true")

        const transform = element.style.transform
        const match = transform ? transform.match(/\d+/g) : null

        offset.x = match ? Number(match[0]) : 0
        offset.y = match ? Number(match[1]) : 0
        clickStart.x = event.clientX
        clickStart.y = event.clientY
      })

      element.addEventListener("mousemove", (event) => {
        if (!element.hasAttribute("target")) return

        const shiftX = event.clientX - clickStart.x
        const shiftY = event.clientY - clickStart.y

        element.style.transform = `translate(${offset.x + shiftX}px,${offset.y + shiftY}px)`
        updateHeight()
      })

      element.addEventListener("mouseup", (event) => {
        if (!element.hasAttribute("target")) return

        element.removeAttribute("target")
        console.log(element, "up")

        inputSVG.value = previewRaw.innerHTML
        inputSVG.dispatchEvent(new Event("input"))
      })
      element.addEventListener("mouseleave", (event) => {
        if (!element.hasAttribute("target")) return

        element.removeAttribute("target")
        console.log(event.target, "leave")

        inputSVG.value = previewRaw.innerHTML
        inputSVG.dispatchEvent(new Event("input"))
      })
    }
  }

  function updateHeight() {
    let height = -Infinity
    for (const child of previewRaw.children) {
      /** @type {SVGElement}*/
      const element = child
      height = Math.max(height, element.getBoundingClientRect().bottom)
    }
    height = height - previewRaw.getBoundingClientRect().top + 20

    previewRaw.style.height = `${height}px`
    previewRaw.setAttribute("height", height.toString())
    previewPrint.style.height = `${height}px`
  }

  function svg2canvas() {
    const svgBlob = new Blob([previewRaw.outerHTML], { type: 'image/svg+xml' });
    const image = new Image();
    const url = URL.createObjectURL(svgBlob);

    image.addEventListener("load", () => {
      // Canvas quality zoom
      let widthMultiplier = 1;
      let heightMultiplier = 1;
      if (printQuality.value == "1" || printQuality.value == "33") {
        widthMultiplier = 2;
      }
      if (printQuality.value == "32" || printQuality.value == "33") {
        heightMultiplier = 3;
      }

      const width = Number(previewRaw.getAttribute("width")) * widthMultiplier;
      const height = Number(previewRaw.getAttribute("height")) * heightMultiplier;

      previewPrint.width = width;
      previewPrint.height = height;

      /** @type {CanvasRenderingContext2D} */
      // @ts-expect-error
      const ctx = previewPrint.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      // Fill white
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, width, height);

      // Paste image
      ctx.drawImage(image, 0, 0, width, height);

      URL.revokeObjectURL(url);
    });

    image.addEventListener("error", (e) => {
      console.log(e);
      console.log("Blob URL:", url);
      console.log("SVG text:", previewRaw.outerHTML);
      window.open(url, '_blank');
    });

    image.src = url;
  }

  function ditheringCanvas() {
    /** @type {CanvasRenderingContext2D}*/
    // @ts-expect-error
    const ctx = previewPrint.getContext("2d")
    const height = previewPrint.height
    const width = previewPrint.width

    // canvas to 2d mapped
    const gray = []
    const image = ctx.getImageData(0, 0, width, height)
    for (let y = 0; y < height; y++) {
      const row = []
      for (let x = 0; x < width; x++) {
        const i = (y * width + x) * 4
        const r = image.data[i]
        const g = image.data[i + 1]
        const b = image.data[i + 2]
        const grayValue = 0.299 * r + 0.587 * g + 0.114 * b
        row.push(grayValue)
      }
      gray.push(row)
    }

    function clamp(n) {
      return Math.max(Math.min(n, 255), 0)
    }

    // Floyd–Steinberg dithering & write pixel
    for (let y = 0; y < height; y++) {
      const isEven = y % 2 === 0
      const xStart = isEven ? 0 : width - 1
      const xEnd = isEven ? width : -1
      const xStep = isEven ? 1 : -1

      for (let x = xStart; x !== xEnd; x += xStep) {
        const oldPixel = gray[y][x]
        const newPixel = oldPixel < 128 ? 0 : 255;
        const diff = oldPixel - newPixel
        const index = (y * width + x) * 4
        image.data[index + 0] = newPixel
        image.data[index + 1] = newPixel
        image.data[index + 2] = newPixel
        image.data[index + 3] = 0xff

        const nextX = x + xStep; // 進行方向の次
        const prevX = x - xStep; // 進行方向の逆（手前）

        // 1. 進行方向の隣 (7 / 16)
        if (nextX >= 0 && nextX < width) {
          gray[y][nextX] = clamp(gray[y][nextX] + (diff * (7 / 16)))
        }
        // 2. 一つ下の、進行方向とは逆の斜め下 (3 / 16)
        if (prevX >= 0 && prevX < width && y + 1 < height) {
          gray[y + 1][prevX] = clamp(gray[y + 1][prevX] + (diff * (3 / 16)))
        }
        // 3. 真下 (5 / 16)
        if (y + 1 < height) {
          gray[y + 1][x] = clamp(gray[y + 1][x] + (diff * (5 / 16)))
        }
        // 4. 一つ下の、進行方向の斜め下 (1 / 16)
        if (nextX >= 0 && nextX < width && y + 1 < height) {
          gray[y + 1][nextX] = clamp(gray[y + 1][nextX] + (diff * (1 / 16)))
        }
      }
    }
    ctx.putImageData(image, 0, 0)
  }


</script>

</html>
